<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login | OmniCare AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/patient_login.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-header">

                <div class="login-icon">
                    +
                </div>

                <h1>Patient Login</h1>

                <p>
                    Login to access your OmniCare AI health records.
                </p>

            </div>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="login-alert {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST"
                  action="{{ url_for('patient_login') }}">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <p class="register-link">

                Don't have an account?

                <a href="{{ url_for('patient_register') }}">
                    Create Account
                </a>

            </p>


            <a
                href="{{ url_for('home') }}"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

</body>
</html>
