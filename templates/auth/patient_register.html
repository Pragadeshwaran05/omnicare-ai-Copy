<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Registration - OmniCare AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/patient_register.css') }}">

</head>


<body>


<div class="register-page">


    <div class="register-card">


        <!-- HEADER -->

        <div class="register-header">

            <div class="register-icon">
                +
            </div>

            <h1>
                Create Your Account
            </h1>

            <p>
                Create your secure OmniCare AI patient account.
            </p>

        </div>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="register-alert {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- REGISTRATION FORM -->

        <form method="POST"
              action="{{ url_for('patient_register') }}">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL + PHONE -->

            <div class="form-row">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        maxlength="10"
                        required
                    >

                </div>

            </div>


            <!-- DOB + BLOOD GROUP -->

            <div class="form-row">

                <div class="form-group">

                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="date_of_birth"
                        name="date_of_birth"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="blood_group">
                        Blood Group
                    </label>

                    <select
                        id="blood_group"
                        name="blood_group"
                        required
                    >

                        <option value="">
                            Select blood group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option value="">
                        Select gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    placeholder="Enter your complete address"
                    required
                ></textarea>

            </div>


            <!-- PASSWORD -->

            <div class="form-row">

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >

                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-button">

                Create Patient Account

            </button>


        </form>


        <!-- LOGIN -->

        <p class="login-link">

            Already have an account?

            <a href="{{ url_for('patient_login') }}">
                Login
            </a>

        </p>


        <!-- HOME -->

        <a
            href="{{ url_for('home') }}"
            class="back-home">

            ← Back to Home

        </a>


    </div>


</div>


</body>

</html>
